<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css" integrity="sha512-1PKOgIY59xJ8Co8+NE6FZ+LOAZKjy+KY8iq0G4B3CyeY6wYHN3yt9PW0XpSriVlkMXe40PTKnXrLnZ9+fkDaog==" crossorigin="anonymous" />
<link rel="stylesheet" href="css\stylesss.css">
<title>Watchflix</title>
</head>
<body>
    <header class="showcase">
        

            <div class="logo">
                <img src="images/logo.png">
            </div>

            <div class="showcase-content">
                <div class="formm">
                    <form>
                        <h1>Sign Up</h1>
                        <div class="info">
                            <input class="email" type="email" id="email" placeholder="Email" name="email" required> <br>
                            <input class="email" type="password" id="password" placeholder="Password" name="email" required>
                            <input class="email" type="password" id="confirm-password" placeholder="Confirm Password" required>
                        </div>
                        <div class="btn">
                            <button class="btn-primary" type="submit" onclick="validateForm()" name="submit"><a href="signin.html">Sign Up</a></button>
                        </div>
                        <div class="help">
                            <div>
                                <input value="true" type="checkbox"><label>Remember me</label>
                            </div>

                            <a href="#">Need Help ?</a>
                        
                        </div>

                    </form>
    
                </div>
                
                <div class="signup">
                    <p>Already registered ?</p>
                    <a href="signin.html">Sign in</a>
                </div>
                <div class="more">
                    <p>
                        This page is protected by Google reCAPTCHA to ensure you're not a bot. <a href="#">Learn more.</a> 
                    </p>
                </div>


            </div>

       
            <footer>
                
                <div class="ftr-content">
                    <div class="contact">
                        <a href="#">Quesions? Contact us.</a>
                    </div>
                    <div class="ftr">
                        <a href="#">Gift Card Terms</a>
                        <a href="#">Terms of Use</a>
                        <a href="#">Privacy Statement</a>
                    </div>
                    <div class="select">
                        <select>
                            <option>English</option>                            
                            
                        </select>
                    </div>
                </div>
               
            </footer>
       
    </header>

    <script src="js/script.js"></script>
</body>
</html>
